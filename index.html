<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Compensation Dashboard | OG Advisory Group</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #d4cdc4;
            min-height: 100vh;
            color: #1a1a1a;
        }

        .header {
            background: #f8f6f3;
            padding: 18px 40px;
            border-bottom: 1px solid #c9c2b8;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-section { display: flex; align-items: center; gap: 20px; }
        .logo svg { height: 36px; width: auto; }
        .header-title { border-left: 1px solid #c9c2b8; padding-left: 20px; }
        .header-title h1 { font-size: 1rem; font-weight: 600; color: #1a1a1a; letter-spacing: 0.5px; text-transform: uppercase; }

        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: #666; text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: #1a1a1a; }

        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }

        .financial-summary {
            background: #f8f6f3;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border: 1px solid #c9c2b8;
        }

        .section-header {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #4a4540;
            margin-bottom: 18px;
            font-weight: 700;
        }

        .summary-table { width: 100%; border-collapse: collapse; }
        .summary-table th {
            text-align: left;
            padding: 12px 15px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6a635a;
            font-weight: 600;
            border-bottom: 2px solid #c9c2b8;
        }
        .summary-table td {
            padding: 14px 15px;
            border-bottom: 1px solid #e5e0d9;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .summary-table tr:hover td { background: #f0ede8; }
        .summary-table .ticker { font-weight: 700; color: #1a1a1a; }
        .summary-table .negative { color: #b33a3a; }
        .summary-table .positive { color: #2d7a4f; }

        .company-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .company-card {
            background: #f8f6f3;
            border: 1px solid #c9c2b8;
            border-radius: 8px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        .company-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
            border-color: #a08c6d;
        }
        .company-card.active {
            border-color: #a08c6d;
            background: linear-gradient(135deg, #f8f6f3 0%, #f0ede8 100%);
            box-shadow: 0 5px 20px rgba(160, 140, 109, 0.25);
        }
        .company-card h3 { font-size: 1.2rem; margin-bottom: 4px; color: #1a1a1a; font-weight: 700; }
        .company-card .currency { font-size: 0.65rem; color: #6a635a; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 600; }
        .company-card .total-comp { font-size: 0.85rem; color: #a08c6d; font-weight: 700; }

        .detail-panel {
            background: #f8f6f3;
            border: 1px solid #c9c2b8;
            border-radius: 8px;
            padding: 28px;
            display: none;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .detail-panel.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 1px solid #e5e0d9;
        }
        .detail-header h2 { font-size: 1.6rem; color: #1a1a1a; font-weight: 700; }
        .detail-header .full-name { color: #6a635a; font-size: 0.85rem; margin-top: 3px; font-weight: 500; }

        .year-tabs { display: flex; gap: 8px; }
        .year-tab {
            padding: 8px 16px;
            background: #ebe6df;
            border: 1px solid #c9c2b8;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #5a534a;
            font-size: 0.8rem;
            font-family: inherit;
            font-weight: 600;
        }
        .year-tab:hover { background: #ddd7ce; color: #1a1a1a; }
        .year-tab.active { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }

        .company-financials {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 22px;
            padding: 18px;
            background: #f0ede8;
            border-radius: 8px;
            border: 1px solid #e0dbd4;
        }
        .financial-item { text-align: center; }
        .financial-item .value { font-size: 1.4rem; font-weight: 700; color: #1a1a1a; }
        .financial-item .value.negative { color: #b33a3a; }
        .financial-item .label { font-size: 0.65rem; color: #6a635a; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; font-weight: 600; }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 22px;
        }
        .stat-card {
            background: #f0ede8;
            border: 1px solid #e0dbd4;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }
        .stat-card .stat-value { font-size: 1.2rem; font-weight: 700; color: #a08c6d; }
        .stat-card .stat-label { color: #6a635a; font-size: 0.65rem; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

        .executives-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }

        .executive-card {
            background: #faf9f7;
            border: 1px solid #e0dbd4;
            border-radius: 8px;
            padding: 18px;
            transition: all 0.3s ease;
        }
        .executive-card:hover { border-color: #a08c6d; box-shadow: 0 3px 12px rgba(0,0,0,0.06); }

        .executive-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .executive-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
        }
        .executive-info h4 { font-size: 0.95rem; color: #1a1a1a; margin-bottom: 2px; font-weight: 700; }
        .executive-info .role { font-size: 0.7rem; color: #6a635a; font-weight: 500; }

        .comp-breakdown { display: grid; gap: 6px; }
        .comp-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 10px;
            background: #fff;
            border-radius: 5px;
            border: 1px solid #f0ede8;
        }
        .comp-item .label { color: #6a635a; font-size: 0.75rem; font-weight: 500; }
        .comp-item .value { color: #1a1a1a; font-weight: 700; font-size: 0.8rem; }
        .comp-item.total { background: #1a1a1a; margin-top: 4px; border: none; }
        .comp-item.total .label { color: #a08c6d; font-weight: 600; }
        .comp-item.total .value { color: #fff; font-size: 0.9rem; }

        .notes {
            margin-top: 10px;
            padding: 9px 11px;
            background: #faf8f4;
            border-left: 3px solid #a08c6d;
            border-radius: 0 5px 5px 0;
            font-size: 0.7rem;
            color: #7a6b55;
            font-weight: 500;
        }

        .equity-section {
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid #e0dbd4;
        }

        .equity-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            padding: 12px 16px;
            background: #f0ede8;
            border: 1px solid #e0dbd4;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .equity-toggle:hover { background: #e8e3dc; }
        .equity-toggle h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #4a4540;
            font-weight: 700;
            margin: 0;
        }
        .equity-toggle .arrow {
            font-size: 1.2rem;
            color: #6a635a;
            transition: transform 0.3s ease;
        }
        .equity-toggle.expanded .arrow { transform: rotate(180deg); }

        .equity-content { display: none; animation: fadeIn 0.3s ease; }
        .equity-content.visible { display: block; }

        .equity-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; background: #faf9f7; border-radius: 6px; overflow: hidden; }
        .equity-table th {
            text-align: left;
            padding: 9px 10px;
            background: #f0ede8;
            color: #6a635a;
            font-weight: 600;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e0dbd4;
        }
        .equity-table td { padding: 9px 10px; border-bottom: 1px solid #f0ede8; color: #1a1a1a; font-weight: 500; }
        .equity-table tr:hover td { background: #f5f3f0; }

        .badge {
            display: inline-block;
            padding: 3px 7px;
            border-radius: 8px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .badge.option { background: #dbeef5; color: #2171a5; }
        .badge.rsu { background: #eedff5; color: #7a3d9e; }

        .welcome-message { text-align: center; padding: 50px 20px; color: #6a635a; }
        .welcome-message h3 { font-size: 1.2rem; color: #1a1a1a; margin-bottom: 8px; font-weight: 600; }

        .additional-info {
            margin-bottom: 18px;
            padding: 14px;
            background: #faf8f4;
            border-left: 3px solid #a08c6d;
            border-radius: 0 6px 6px 0;
            font-size: 0.8rem;
            color: #7a6b55;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            .header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .header-title { border-left: none; padding-left: 0; text-align: center; }
            .detail-header { flex-direction: column; gap: 15px; align-items: flex-start; }
            .executives-grid { grid-template-columns: 1fr; }
            .equity-table { display: block; overflow-x: auto; }
            .company-financials { grid-template-columns: repeat(2, 1fr); }
            .nav-links { display: none; }
        }
    </style>
</head>

        function formatCurrency(a, c) {
            if (a === undefined || a === null) return '-';
            return (c === 'CAD' ? 'C$' : '$') + a.toLocaleString('en-US');
        }

        function getInitials(n) { return n.split(' ').map(x => x[0]).join('').substring(0, 2); }
        function getTotalComp(c, y) { const d = compensationData[c].years[y]; return d ? d.executives.reduce((s, e) => s + (e.reportedTotal || 0), 0) : 0; }
        function getLatestYear(c) { return Math.max(...Object.keys(compensationData[c].years).map(Number)); }

        function renderSummaryTable() {
            const t = document.getElementById('summaryTableBody');
            const o = ['LMFA', 'BTBT', 'HIVE', 'DMG', 'PHX'];
            t.innerHTML = o.map(k => {
                const f = financialData[k];
                return `<tr>
                    <td class="ticker">${k}</td>
                    <td>${f.marketCap ? '$' + f.marketCap : '-'}</td>
                    <td>$${f.revenue}</td>
                    <td>${f.ebitda !== null ? '$' + f.ebitda : '-'}</td>
                    <td class="${f.netIncome < 0 ? 'negative' : 'positive'}">${f.netIncome < 0 ? '($' + Math.abs(f.netIncome) + ')' : '$' + f.netIncome}</td>
                </tr>`;
            }).join('');
        }

        function renderCompanyCards() {
            const g = document.getElementById('companyGrid');
            const o = ['LMFA', 'BTBT', 'HIVE', 'DMG', 'PHX'];
            g.innerHTML = '';
            o.forEach(c => {
                const d = compensationData[c], y = getLatestYear(c), t = getTotalComp(c, y);
                const card = document.createElement('div');
                card.className = 'company-card';
                card.dataset.company = c;
                card.innerHTML = `<h3>${d.name}</h3><div class="currency">${d.currency}</div><div class="total-comp">FY${y}: ${formatCurrency(t, d.currency)}</div>`;
                card.addEventListener('click', () => selectCompany(c));
                g.appendChild(card);
            });
        }

        let currentCompany = null, currentYear = null;

        function selectCompany(c) {
            currentCompany = c;
            currentYear = getLatestYear(c);
            document.querySelectorAll('.company-card').forEach(card => card.classList.toggle('active', card.dataset.company === c));
            document.getElementById('detailPanel').classList.add('active');
            document.getElementById('welcomeMessage').style.display = 'none';
            renderCompanyDetail();
        }

        function renderCompanyDetail() {
            const c = compensationData[currentCompany], y = c.years[currentYear];
            const f = financialData[currentCompany];
            const yrs = Object.keys(c.years).map(Number).sort((a, b) => b - a);
            const total = y.executives.reduce((s, e) => s + (e.reportedTotal || 0), 0);

            // For PHX, use executiveCount of 5, otherwise count executives
            const execCount = c.executiveCount || y.executives.length;
            const avg = total / execCount;
            const max = Math.max(...y.executives.map(e => e.reportedTotal || 0));

            let h = `
                <div class="detail-header">
                    <div>
                        <h2>${c.name}</h2>
                        <p class="full-name">${c.fullName}</p>
                    </div>
                    <div class="year-tabs">
                        ${yrs.map(yr => `<button class="year-tab ${yr === currentYear ? 'active' : ''}" onclick="changeYear(${yr})">FY ${yr}</button>`).join('')}
                    </div>
                </div>

                <div class="company-financials">
                    <div class="financial-item">
                        <div class="value">${f.marketCap ? '$' + f.marketCap + 'M' : '-'}</div>
                        <div class="label">Market Cap</div>
                    </div>
                    <div class="financial-item">
                        <div class="value">$${f.revenue}M</div>
                        <div class="label">Revenue (LTM)</div>
                    </div>
                    <div class="financial-item">
                        <div class="value">${f.ebitda !== null ? '$' + f.ebitda + 'M' : '-'}</div>
                        <div class="label">EBITDA (LTM)</div>
                    </div>
                    <div class="financial-item">
                        <div class="value ${f.netIncome < 0 ? 'negative' : ''}">${f.netIncome < 0 ? '($' + Math.abs(f.netIncome) + 'M)' : '$' + f.netIncome + 'M'}</div>
                        <div class="label">Net Income (LTM)</div>
                    </div>
                </div>

                <div class="summary-stats">
                    <div class="stat-card">
                        <div class="stat-value">${formatCurrency(total, c.currency)}</div>
                        <div class="stat-label">Total Compensation</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${formatCurrency(Math.round(avg), c.currency)}</div>
                        <div class="stat-label">Average per Executive</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${execCount}</div>
                        <div class="stat-label">Executives</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${formatCurrency(max, c.currency)}</div>
                        <div class="stat-label">Highest Compensation</div>
                    </div>
                </div>

                ${y.additionalInfo ? `<div class="additional-info">${y.additionalInfo}</div>` : ''}

                <p class="section-header">Executive Compensation Breakdown</p>
                <div class="executives-grid">${y.executives.map(e => renderExecutiveCard(e, c.currency, c.equityAwards && c.equityAwards[e.name])).join('')}</div>
            `;

            // Add collapsible equity awards for DMG
            if (currentCompany === 'DMG' && c.equityAwards) {
                h += `
                    <div class="equity-section">
                        <div class="equity-toggle" onclick="toggleEquity()">
                            <h3>Equity Awards Details</h3>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="equity-content" id="equityContent">
                            ${Object.entries(c.equityAwards).map(([n, a]) => `
                                <h4 style="margin:18px 0 12px;color:#1a1a1a;font-size:0.9rem;font-weight:700;">${n}</h4>
                                <table class="equity-table">
                                    <thead>
                                        <tr>
                                            <th>Type</th>
                                            <th>Units</th>
                                            <th>Grant Date</th>
                                            <th>Exercise Price</th>
                                            <th>Price at Grant</th>
                                            <th>Expiry</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${a.map(x => `
                                            <tr>
                                                <td><span class="badge ${x.type === 'RSUs' ? 'rsu' : 'option'}">${x.type}</span></td>
                                                <td>${x.units.toLocaleString()}</td>
                                                <td>${x.grantDate}</td>
                                                <td>${x.exercisePrice ? 'C$' + x.exercisePrice.toFixed(2) : '-'}</td>
                                                <td>C$${x.priceAtGrant.toFixed(2)}</td>
                                                <td>${x.expiry}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            document.getElementById('companyDetail').innerHTML = h;
        }

        function toggleEquity() {
            const toggle = document.querySelector('.equity-toggle');
            const content = document.getElementById('equityContent');
            toggle.classList.toggle('expanded');
            content.classList.toggle('visible');
        }

        function renderExecutiveCard(e, cur, hasEquityAwards) {
            const items = [];
            if (e.salary) items.push({ label: 'Base Salary', value: e.salary });
            if (e.cashBonus) items.push({ label: 'Cash Bonus', value: e.cashBonus });
            if (e.annualIncentive) items.push({ label: 'Annual Incentive', value: e.annualIncentive });
            if (e.stockAwardsValue) items.push({ label: 'Stock Awards', value: e.stockAwardsValue });
            if (e.optionAwardsValue) items.push({ label: 'Option Awards', value: e.optionAwardsValue });
            if (e.allOtherComp) items.push({ label: 'Other Compensation', value: e.allOtherComp });
            if (hasEquityAwards) items.push({ label: 'Equity Awards', value: 'See Details Below', isText: true });

            return `
                <div class="executive-card">
                    <div class="executive-header">
                        <div class="executive-avatar">${getInitials(e.name)}</div>
                        <div class="executive-info">
                            <h4>${e.name}</h4>
                            <div class="role">${e.role}</div>
                        </div>
                    </div>
                    <div class="comp-breakdown">
                        ${items.map(i => `
                            <div class="comp-item">
                                <span class="label">${i.label}</span>
                                <span class="value">${i.isText ? i.value : formatCurrency(i.value, cur)}</span>
                            </div>
                        `).join('')}
                        ${e.stockAwardsUnits ? `
                            <div class="comp-item">
                                <span class="label">Stock Awards (Units)</span>
                                <span class="value">${e.stockAwardsUnits.toLocaleString()}</span>
                            </div>
                        ` : ''}
                        <div class="comp-item total">
                            <span class="label">Total Compensation</span>
                            <span class="value">${formatCurrency(e.reportedTotal, cur)}</span>
                        </div>
                    </div>
                    ${e.notes ? `<div class="notes">${e.notes}</div>` : ''}
                </div>
            `;
        }

        function changeYear(y) { currentYear = y; renderCompanyDetail(); }

        document.addEventListener('DOMContentLoaded', () => {
            renderSummaryTable();
            renderCompanyCards();
            document.getElementById('detailPanel').classList.add('active');
        });
    </script>
</body>
</html>
