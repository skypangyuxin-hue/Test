<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Advisory Comp Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 380px;
            min-height: 400px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #d4cdc4;
            color: #1a1a1a;
        }

        .header {
            background: #1a1a1a;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #e67e22;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: #e67e22;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
        }

        .header h1 {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .search-box {
            padding: 10px 16px;
            background: #f8f6f3;
            border-bottom: 1px solid #c9c2b8;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #c9c2b8;
            border-radius: 6px;
            font-size: 12px;
            font-family: inherit;
            background: #fff;
        }

        .search-input:focus {
            outline: none;
            border-color: #a08c6d;
        }

        .company-list {
            max-height: 450px;
            overflow-y: auto;
        }

        .company-item {
            padding: 12px 16px;
            background: #f8f6f3;
            border-bottom: 1px solid #e0dbd4;
            cursor: pointer;
            transition: all 0.2s;
        }

        .company-item:hover {
            background: #f0ede8;
            border-left: 3px solid #e67e22;
            padding-left: 13px;
        }

        .company-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .company-name {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .company-ticker {
            font-size: 11px;
            padding: 2px 8px;
            background: #1a1a1a;
            color: #fff;
            border-radius: 10px;
            font-weight: 600;
        }

        .company-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .stat {
            font-size: 11px;
            color: #6a635a;
        }

        .stat-label {
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }

        .stat-value {
            font-weight: 700;
            color: #1a1a1a;
        }

        .total-comp {
            font-size: 13px;
            color: #e67e22;
            font-weight: 700;
            margin-top: 6px;
        }

        .detail-view {
            display: none;
            background: #f8f6f3;
            min-height: 400px;
        }

        .detail-view.active {
            display: block;
        }

        .detail-header {
            background: #1a1a1a;
            padding: 12px 16px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #e67e22;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:hover {
            color: #fff;
        }

        .detail-header h2 {
            font-size: 14px;
            font-weight: 700;
        }

        .detail-content {
            padding: 16px;
            max-height: 430px;
            overflow-y: auto;
        }

        .financials {
            background: #fff;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #e0dbd4;
        }

        .financials-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6a635a;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .financial-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .financial-stat {
            text-align: center;
        }

        .financial-stat .value {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .financial-stat .value.negative {
            color: #b33a3a;
        }

        .financial-stat .label {
            font-size: 9px;
            color: #6a635a;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .executives-section {
            margin-top: 12px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6a635a;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .executive-card {
            background: #fff;
            border: 1px solid #e0dbd4;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .exec-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .exec-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
        }

        .exec-info h4 {
            font-size: 12px;
            color: #1a1a1a;
            font-weight: 700;
            margin-bottom: 1px;
        }

        .exec-info .role {
            font-size: 9px;
            color: #6a635a;
        }

        .comp-items {
            display: grid;
            gap: 4px;
        }

        .comp-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            padding: 4px 6px;
            background: #f8f6f3;
            border-radius: 3px;
        }

        .comp-row.total {
            background: #1a1a1a;
            color: #fff;
            font-weight: 700;
            margin-top: 4px;
        }

        .comp-row.total .label {
            color: #e67e22;
        }

        .no-results {
            padding: 40px 20px;
            text-align: center;
            color: #6a635a;
            font-size: 12px;
        }

        .footer {
            background: #f0ede8;
            padding: 10px 16px;
            text-align: center;
            border-top: 1px solid #c9c2b8;
            font-size: 10px;
            color: #6a635a;
        }

        .footer a {
            color: #e67e22;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f0ede8;
        }

        ::-webkit-scrollbar-thumb {
            background: #c9c2b8;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a08c6d;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">OG</div>
        <h1>Executive Comp Tracker</h1>
    </div>

    <div id="listView">
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Search companies...">
        </div>

        <div class="company-list" id="companyList"></div>
    </div>

    <div id="detailView" class="detail-view">
        <div class="detail-header">
            <button class="back-btn" id="backBtn">←</button>
            <h2 id="detailTitle"></h2>
        </div>
        <div class="detail-content" id="detailContent"></div>
    </div>

    <div class="footer">
        <a href="https://www.orangegroupadvisors.com/" target="_blank">Orange Group Advisors</a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
